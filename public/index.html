<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Dashboard</title>

  <script src="/socket.io/socket.io.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      color: #00ffcc;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: #222;
      padding: 15px;
      margin: 10px;
      border-radius: 10px;
      width: 200px;
    }

    .value {
      font-size: 20px;
      color: #00ffcc;
    }

    #map {
      height: 350px;
      width: 90%;
      margin: 20px auto;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>🚗 Vehicle Dashboard</h1>

<div class="container">

  <div class="card">
    <h3>State</h3>
    <div id="state" class="value">---</div>
  </div>

  <div class="card">
    <h3>Speed</h3>
    <div id="speed" class="value">0</div>
  </div>

  <div class="card">
    <h3>Satellites</h3>
    <div id="sats" class="value">0</div>
  </div>

  <div class="card">
    <h3>Latitude</h3>
    <div id="lat" class="value">0</div>
  </div>

  <div class="card">
    <h3>Longitude</h3>
    <div id="lng" class="value">0</div>
  </div>

  <!-- NEW ADXL DATA -->
  <div class="card">
    <h3>AX</h3>
    <div id="ax" class="value">0</div>
  </div>

  <div class="card">
    <h3>AY</h3>
    <div id="ay" class="value">0</div>
  </div>

  <div class="card">
    <h3>AZ</h3>
    <div id="az" class="value">0</div>
  </div>

  <div class="card">
    <h3>Magnitude</h3>
    <div id="mag" class="value">0</div>
  </div>

</div>

<div id="map"></div>

<script>
const socket = io({
  transports: ["websocket"]
});

// Map
let map = L.map('map').setView([28.0, 77.0], 13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let marker = L.marker([28.0, 77.0]).addTo(map);

socket.on("data", (msg) => {
    const data = JSON.parse(msg);

    console.log("DATA:", data);

    document.getElementById("state").innerText = data.state;
    document.getElementById("speed").innerText = data.speed;
    document.getElementById("sats").innerText = data.sats;
    document.getElementById("lat").innerText = data.lat;
    document.getElementById("lng").innerText = data.lng;

    document.getElementById("ax").innerText = data.ax;
    document.getElementById("ay").innerText = data.ay;
    document.getElementById("az").innerText = data.az;
    document.getElementById("mag").innerText = data.mag;

    if (data.lat && data.lng) {
        const lat = parseFloat(data.lat);
        const lng = parseFloat(data.lng);

        marker.setLatLng([lat, lng]);
        map.setView([lat, lng], 15);
    }
});
</script>

</body>
</html>
