<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Monitor</title>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- MAP -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI';
      background: #050b14;
      color: #00ffc3;
    }

    header {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      background: #0b1c2c;
      border-bottom: 1px solid #00ffc355;
    }

    .tabs button {
      background: none;
      border: none;
      color: #00ffc3;
      margin: 0 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .active-tab {
      border-bottom: 2px solid #00ffc3;
    }

    .page {
      display: none;
      padding: 20px;
    }

    .active {
      display: block;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .card {
      background: #0b1c2c;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,255,200,0.1);
    }

    .flex {
      display: flex;
      gap: 10px;
    }

    .axis {
      flex: 1;
      text-align: center;
      background: #071421;
      padding: 10px;
      border-radius: 10px;
    }

    #map {
      height: 300px;
      border-radius: 10px;
    }

    .event {
      background: #071421;
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      text-align: center;
    }

    .log {
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
    }

    button {
      margin-top: 10px;
      padding: 8px;
      background: #00ffc3;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h2>🚗 Vehicle Monitor</h2>

  <div class="tabs">
    <button onclick="showTab('live')" id="tab-live" class="active-tab">LIVE</button>
    <button onclick="showTab('history')" id="tab-history">HISTORY</button>
  </div>
</header>

<!-- LIVE PAGE -->
<div id="live" class="page active">
  <div class="grid">

    <!-- LEFT -->
    <div>

      <div class="card">
        <h3>Accelerometer</h3>
        <div class="flex">
          <div class="axis">X<br><span id="ax">0</span></div>
          <div class="axis">Y<br><span id="ay">0</span></div>
          <div class="axis">Z<br><span id="az">0</span></div>
        </div>
      </div>

      <div class="card">
        <h3>Graph</h3>
        <canvas id="chart"></canvas>
      </div>

      <div class="card">
        <h3>Map</h3>
        <div id="map"></div>
      </div>

    </div>

    <!-- RIGHT -->
    <div>

      <div class="card">
        <h3>Status</h3>
        <h2 id="state">NORMAL</h2>
        <p>Speed: <span id="speed">0</span> km/h</p>
        <p>Sats: <span id="sats">0</span></p>
      </div>

      <div class="card">
        <h3>Event Counters</h3>
        <div class="flex">
          <div class="event">Collision<br><span id="c1">0</span></div>
          <div class="event">Rash<br><span id="c2">0</span></div>
        </div>
        <div class="flex">
          <div class="event">Tow<br><span id="c3">0</span></div>
          <div class="event">Topple<br><span id="c4">0</span></div>
        </div>

        <button onclick="reset()">Reset</button>
      </div>

      <div class="card">
        <h3>Live Events</h3>
        <div id="log" class="log"></div>
      </div>

    </div>
  </div>
</div>

<!-- HISTORY PAGE -->
<div id="history" class="page">
  <div class="card">
    <h3>Event History</h3>
    <div id="historyLog" class="log"></div>
  </div>
</div>

<script>
const socket = io();

let counts = { COLLISION:0, RASH:0, TOW:0, TOPPLE:0 };
let history = [];

// MAP
let map = L.map('map').setView([28,77], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker = L.marker([28,77]).addTo(map);

// CHART
let labels = [], axData=[], ayData=[], azData=[];
const chart = new Chart(document.getElementById("chart"), {
  type: "line",
  data: {
    labels,
    datasets: [
      { label:"X", data:axData },
      { label:"Y", data:ayData },
      { label:"Z", data:azData }
    ]
  },
  options:{ animation:false }
});

// SOCKET
socket.on("data", msg => {
  const d = JSON.parse(msg);

  document.getElementById("ax").innerText = d.ax.toFixed(2);
  document.getElementById("ay").innerText = d.ay.toFixed(2);
  document.getElementById("az").innerText = d.az.toFixed(2);

  document.getElementById("speed").innerText = d.speed || 0;
  document.getElementById("sats").innerText = d.sats || 0;
  document.getElementById("state").innerText = d.state;

  if(counts[d.state] !== undefined) counts[d.state]++;

  document.getElementById("c1").innerText = counts.COLLISION;
  document.getElementById("c2").innerText = counts.RASH;
  document.getElementById("c3").innerText = counts.TOW;
  document.getElementById("c4").innerText = counts.TOPPLE;

  if(d.state !== "NORMAL"){
    const log = document.getElementById("log");
    const entry = document.createElement("div");
    entry.innerText = `${d.state} | X:${d.ax}`;
    log.prepend(entry);

    history.unshift(entry.innerText);
    document.getElementById("historyLog").innerHTML = history.join("<br>");
  }

  // chart
  labels.push("");
  axData.push(d.ax);
  ayData.push(d.ay);
  azData.push(d.az);

  if(labels.length>50){
    labels.shift(); axData.shift(); ayData.shift(); azData.shift();
  }
  chart.update();

  // map
  if(d.lat && d.lng){
    marker.setLatLng([d.lat,d.lng]);
    map.setView([d.lat,d.lng], 15);
  }
});

function reset(){
  counts = { COLLISION:0, RASH:0, TOW:0, TOPPLE:0 };
}

function showTab(tab){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(tab).classList.add("active");

  document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active-tab"));
  document.getElementById("tab-"+tab).classList.add("active-tab");
}
</script>

</body>
</html>
