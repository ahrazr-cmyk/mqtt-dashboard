<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Pro Dashboard</title>

  <script src="/socket.io/socket.io.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      background: #0b0f1a;
      color: white;
      font-family: Arial;
      text-align: center;
    }

    h1 {
      color: #00ffc3;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      background: #121826;
      margin: 10px;
      padding: 15px;
      border-radius: 12px;
      width: 180px;
      box-shadow: 0 0 15px rgba(0,255,200,0.2);
    }

    .value {
      font-size: 20px;
      color: #00ffc3;
    }

    #map {
      height: 300px;
      margin: 20px;
      border-radius: 10px;
    }

    canvas {
      max-width: 90%;
      margin: 20px auto;
    }

    button {
      padding: 10px 20px;
      background: #00ffc3;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 10px;
    }
  </style>
</head>

<body>

<h1>🚗 Vehicle Analytics Dashboard</h1>

<div class="grid">

  <div class="card"><h3>State</h3><div id="state" class="value">---</div></div>
  <div class="card"><h3>Speed</h3><div id="speed" class="value">0</div></div>
  <div class="card"><h3>Sats</h3><div id="sats" class="value">0</div></div>

  <div class="card"><h3>AX</h3><div id="ax" class="value">0</div></div>
  <div class="card"><h3>AY</h3><div id="ay" class="value">0</div></div>
  <div class="card"><h3>AZ</h3><div id="az" class="value">0</div></div>

  <div class="card"><h3>Collisions</h3><div id="collisionCount" class="value">0</div></div>
  <div class="card"><h3>Rash</h3><div id="rashCount" class="value">0</div></div>
  <div class="card"><h3>Tow</h3><div id="towCount" class="value">0</div></div>
  <div class="card"><h3>Topple</h3><div id="toppleCount" class="value">0</div></div>

</div>

<button onclick="resetCounts()">Reset Counters</button>

<canvas id="chart"></canvas>

<div id="map"></div>

<script>
const socket = io({ transports: ["websocket"] });

// Counters
let counts = {
  COLLISION: 0,
  RASH: 0,
  TOW: 0,
  TOPPLE: 0
};

// History buffers
let labels = [];
let axData = [];
let ayData = [];
let azData = [];

// Chart
const ctx = document.getElementById('chart').getContext('2d');

const chart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: labels,
    datasets: [
      { label: 'AX', data: axData, borderColor: 'red' },
      { label: 'AY', data: ayData, borderColor: 'yellow' },
      { label: 'AZ', data: azData, borderColor: 'cyan' }
    ]
  },
  options: {
    animation: false,
    scales: {
      y: { min: -2, max: 2 }
    }
  }
});

// Map
let map = L.map('map').setView([28.0, 77.0], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let marker = L.marker([28.0, 77.0]).addTo(map);

// Reset
function resetCounts() {
  counts = { COLLISION:0, RASH:0, TOW:0, TOPPLE:0 };
}

// Socket data
socket.on("data", (msg) => {
  const d = JSON.parse(msg);

  document.getElementById("state").innerText = d.state;
  document.getElementById("speed").innerText = d.speed;
  document.getElementById("sats").innerText = d.sats;

  document.getElementById("ax").innerText = d.ax;
  document.getElementById("ay").innerText = d.ay;
  document.getElementById("az").innerText = d.az;

  // Count events
  if (counts[d.state] !== undefined) {
    counts[d.state]++;
  }

  document.getElementById("collisionCount").innerText = counts.COLLISION;
  document.getElementById("rashCount").innerText = counts.RASH;
  document.getElementById("towCount").innerText = counts.TOW;
  document.getElementById("toppleCount").innerText = counts.TOPPLE;

  // Graph update
  labels.push("");
  axData.push(d.ax);
  ayData.push(d.ay);
  azData.push(d.az);

  if (labels.length > 50) {
    labels.shift();
    axData.shift();
    ayData.shift();
    azData.shift();
  }

  chart.update();

  // Map update
  if (d.lat && d.lng) {
    const pos = [parseFloat(d.lat), parseFloat(d.lng)];
    marker.setLatLng(pos);
    map.setView(pos, 15);
  }
});
</script>

</body>
</html>
